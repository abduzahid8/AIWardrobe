services:
  # Static web frontend (Expo web export)
  - type: web
    name: aiwardrobe-web
    env: static
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Express API backend
  - type: web
    name: aiwardrobe-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: api
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    url: https://aiwardrobe-api.onrender.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HF_TOKEN
        value: "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"
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: MOBILE_VTON_SERVICE_URL
        value: "https://karimdzanovzoha--aiwardrobe-mobile-vton-fastapi-app.modal.run"
      - key: MODAL_MOBILE_VTON_URL
        value: "https://karimdzanovzoha--aiwardrobe-mobile-vton-fastapi-app.modal.run"
      - key: ALLOWED_ORIGINS
        value: "*"
