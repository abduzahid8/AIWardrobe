appId: host.exp.Exponent
name: sim_stylist_50_one
---
- runFlow:
    when:
      visible: ".*(Your Outfits|Ваши образы).*"
    commands:
      - tapOn:
          point: "8%,11%"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: ".*(Good morning|Good afternoon|Good evening|Доброе утро|Добрый день|Create outfit|Создать образ).*"
    commands:
      - tapOn: ".*(Создать образ|Create outfit).*"
      - waitForAnimationToEnd:
          timeout: 10000
- runFlow:
    when:
      visible: ".*(Вдохновение|Inspiration).*"
    commands:
      - tapOn: ".*(Магазин|Shop).*"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Персональный стилист|Personal stylist).*"
      - waitForAnimationToEnd:
          timeout: 10000
- assertVisible:
    id: stylistCommentInput
- runFlow:
    when:
      visible: ".*(New clothing|Новая одежда).*"
    commands:
      - tapOn: ".*(New clothing|Новая одежда).*"
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn:
    id: stylistCommentInput
- eraseText
- inputText: ${COMMENT}
# Do NOT tap a style chip here: tapping a chip clears commentEditedRef, so the
# typed comment (which carries style + occasion) would be ignored and every
# scenario would collapse to the chip's style. Comments must win.
# KeyboardAvoidingView lifts the Generate bar above the keyboard, so no manual
# dismiss is needed (the multiline input's return key only inserts a newline).
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: stylistGenerate
# Live Supabase generation can exceed 20s, so a short pre-assert aborts the flow
# before results land. Wait once, generously, for the results header.
- extendedWaitUntil:
    visible: ".*(Your Outfits|Ваши образы).*"
    timeout: 75000
- takeScreenshot: ${SHOT}
