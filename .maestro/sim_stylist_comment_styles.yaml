appId: com.aiwardrobe
name: sim_stylist_comment_styles
---
- launchApp:
    stopApp: false
- tapOn:
    text: "Dismiss"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "Your Outfits"
    commands:
      - tapOn:
          point: "8%,11%"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: ".*(Good morning|Good afternoon|Good evening|Create outfit).*"
    commands:
      - tapOn:
          point: "58%,92%"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Магазин|Shop).*"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Персональный стилист|Personal stylist).*"
      - waitForAnimationToEnd:
          timeout: 10000
- tapOn: ".*(New clothing).*"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: stylistCommentInput
- eraseText
- inputText: "weekend casual brunch"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*Generate outfit.*"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: verify_casual_copy
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: stylistCommentInput
- eraseText
- inputText: "date night classic"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*Generate outfit.*"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: verify_classic_copy
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: stylistCommentInput
- eraseText
- inputText: "old money work"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*Generate outfit.*"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: verify_old_money_work
