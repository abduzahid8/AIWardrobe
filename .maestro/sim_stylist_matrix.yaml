    timeout: 55000
- takeScreenshot: matrix_casual_brunch
- swipe:
    start: "82%,42%"
    end: "18%,42%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: matrix_casual_brunch_card2
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000

# 3. Formal wedding
- assertVisible: ".*Generate outfit.*"
- tapOn: ".*(Add details|Where you're going|weekend).*"
- eraseText
- inputText: "formal wedding guest"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "50%,93%"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: matrix_formal_wedding
- swipe:
    start: "82%,42%"
    end: "18%,42%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: matrix_formal_wedding_card2
- tapOn:
    point: "8%,11%"
