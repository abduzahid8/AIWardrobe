appId: com.aiwardrobe
name: sim_stylist_ids
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Your Outfits"
    commands:
      - tapOn:
          point: "8%,11%"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: ".*(Good morning|Good afternoon|Good evening|Create outfit).*"
    commands:
      - tapOn:
          point: "58%,92%"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Магазин|Shop).*"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Персональный стилист|Personal stylist).*"
      - waitForAnimationToEnd:
          timeout: 10000
- assertVisible: ".*Generate outfit.*"
- tapOn: ".*(New clothing|Новая одежда).*"
- waitForAnimationToEnd:
    timeout: 2500

# 1. Casual + Minimalist
- tapOn:
    id: stylistOccasion-casual
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    id: stylistMoreStyles
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: stylistStyle-minimalist
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    point: "50%,93%"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: scen_casual_minimalist
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000

# 2. Formal + Old Money
- tapOn:
    id: stylistMoreOccasions
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: stylistOccasion-formal
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    id: stylistStyle-old_money
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    point: "50%,93%"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: scen_formal_old_money
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000

# 3. Travel + Semi-Classic
- tapOn:
    id: stylistMoreOccasions
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: stylistOccasion-travel
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    id: stylistMoreStyles
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: stylistStyle-semi_classic
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    point: "50%,93%"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: scen_travel_semi
