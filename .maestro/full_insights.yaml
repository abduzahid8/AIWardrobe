appId: host.exp.Exponent
name: full_insights
tags:
  - full
  - expo-go
  - profile
---
# Weekly Insights round trip: Profile → Insights (stat cards, usage ring,
# unworn items, breakdown) → back. Read-only. Logged IN. Ends on Profile.
- tapOn:
    point: "74%,92%"
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: ".*(Инсайты|Insights).*"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: ".*(Стильные инсайты|Style Insights|Insights).*"
- assertVisible: ".*(Всего вещей|Total items|Разбивка гардероба|Breakdown).*"
- tapOn: ".*(Назад|Back|Go back).*"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: ".*(Аккаунт|Account).*"
- takeScreenshot: full_insights
