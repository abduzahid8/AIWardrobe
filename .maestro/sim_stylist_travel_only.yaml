appId: com.aiwardrobe
name: sim_stylist_travel_only
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "Your Outfits"
    commands:
      - tapOn:
          point: "8%,11%"
      - waitForAnimationToEnd:
          timeout: 8000
- assertVisible: ".*Generate outfit.*"
- tapOn:
    id: stylistMoreOccasions
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: stylistOccasion-travel
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    id: stylistMoreStyles
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: stylistStyle-semi_classic
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    point: "50%,93%"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: scen_travel_semi
