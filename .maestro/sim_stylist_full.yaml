- takeScreenshot: s2_date_classic
- assertVisible: ".*(Pants|PANTS).*"
- assertVisible: ".*(Shoes|SHOES).*"
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000

