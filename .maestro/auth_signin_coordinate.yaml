appId: com.aiwardrobe
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 60000
# clearState wipes @app_language → first-run language gate shows first.
# Complete it in English so the coordinate taps below land on Sign In.
- runFlow:
    when:
      visible: "Choose your language"
    commands:
      - tapOn: "English"
      - waitForAnimationToEnd:
          timeout: 20000
# NOTE (2026-10-02): e2etest@aiwardrobe.club credentials stopped working
# ("Invalid login credentials"). Reprovisioned as e2e.stylist@aiwardrobe.club.
# If sign-in starts failing again, create a fresh account (confirm-email is
# OFF, so signup returns a session immediately) and update these two lines.
- tapOn:
    point: "50%,26%"
- inputText: "e2e.stylist@aiwardrobe.club"
- tapOn:
    point: "50%,33%"
- inputText: "E2eStylistVerify2026!"
- tapOn:
    point: "50%,44%"
- waitForAnimationToEnd:
    timeout: 20000
