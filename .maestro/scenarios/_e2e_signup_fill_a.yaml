appId: host.exp.Exponent
---
# GENERATED by .maestro/run_e2e_3.sh (substitutes e2ecyc1791548679). Clipboard holds
# the PASSWORD when this runs. Order: typed username FIRST (typing degrades
# after a paste), then paste password (secure-field inputText is lossy).
- tapOn:
    id: "signUpUsernameInput"
- eraseText: 60
- inputText: "e2ecyc1791548679"
- tapOn: "or"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "signUpPasswordInput"
- eraseText: 60
# In-flow clipboard write: immune to the host pasteboard (the user copies
# text on the Mac mid-run, which syncs into the simulator and wins races
# against a runner-side pbcopy done seconds earlier).
- setClipboard: "Abcdef123!"
- longPressOn:
    id: "signUpPasswordInput"
- extendedWaitUntil:
    visible: "Paste"
    timeout: 6000
- tapOn: "Paste"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "or"
- waitForAnimationToEnd:
    timeout: 1500
