appId: host.exp.Exponent
---
# GENERATED by .maestro/run_e2e_3.sh (substitutes __USER__/__EMAIL__).
# PRECONDITION: username+password already filled (fill_a), form open.
# Dismisses a leftover validation alert first (runner may retry this flow
# after a host-clipboard race pasted foreign text into the email field).
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 1500
- tapOn:
    id: "signUpEmailInput"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd:
          timeout: 2000
- setClipboard: "__EMAIL__"
- longPressOn:
    id: "signUpEmailInput"
- extendedWaitUntil:
    visible: "Paste"
    timeout: 6000
- tapOn: "Paste"
- waitForAnimationToEnd:
    timeout: 2000

# Dismiss keyboard, scroll to the fold, submit.
- tapOn: "or"
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%,78%"
    end: "50%,38%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "signUpSubmitButton"

# ── Validation-alert retries (validation order: email → password → username)
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Invalid Email"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpEmailInput"
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
            - waitForAnimationToEnd:
                timeout: 1500
      - setClipboard: "__EMAIL__"
      - longPressOn:
          id: "signUpEmailInput"
      - extendedWaitUntil:
          visible: "Paste"
          timeout: 6000
      - tapOn: "Paste"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: "or"
      - waitForAnimationToEnd:
          timeout: 1500
      - swipe:
          start: "50%,78%"
          end: "50%,38%"
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpSubmitButton"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Password Requirements"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpPasswordInput"
      - eraseText: 60
      - inputText: "Abcdef123!"
      - tapOn: "or"
      - waitForAnimationToEnd:
          timeout: 1500
      - swipe:
          start: "50%,78%"
          end: "50%,38%"
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpSubmitButton"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Invalid Username"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpUsernameInput"
      - eraseText: 60
      - inputText: "__USER__"
      - tapOn: "or"
      - waitForAnimationToEnd:
          timeout: 1500
      - swipe:
          start: "50%,78%"
          end: "50%,38%"
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpSubmitButton"
      - waitForAnimationToEnd:
          timeout: 3000

# Success gate: register() must navigate to the style quiz.
# iOS "Save Password?" sheet hides the ENTIRE app AX tree (text never appears
# in the hierarchy), so `when visible "Save Password"` can never fire while it
# blocks. Instead: while the quiz is not visible, tap the sheet's "Not Now"
# position (32%,63%) — harmless on the form, correct on the sheet. Then gate.
- runFlow:
    when:
      notVisible: "Your Style, Decoded."
    commands:
      - tapOn:
          point: "32%,63%"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible: "Your Style, Decoded."
    commands:
      - tapOn:
          point: "32%,63%"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible: "Your Style, Decoded."
    commands:
      - tapOn:
          point: "32%,63%"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible: "Your Style, Decoded."
    commands:
      - tapOn:
          point: "32%,63%"
      - waitForAnimationToEnd:
          timeout: 2000

- extendedWaitUntil:
    visible: "Your Style, Decoded."
    timeout: 60000

- runFlow:
    when:
      visible: ".*Save Password.*"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 3000
