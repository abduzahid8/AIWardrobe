appId: host.exp.Exponent
---
# GENERATED by .maestro/run_e2e_3.sh — template. Do not run this file
# directly; the runner substitutes __USER__ and writes _e2e_signup_fill.yaml.
#
# PRECONDITION: SignUp form open. The runner has pbcopy'd the unique address.
#
# ORDER MATTERS (both learned the hard way):
#   1. TYPE password/username FIRST — keystrokes degrade after a Paste event
#      (verified: Abcdef123! = 10/10 chars without paste, 4/10 after).
#   2. PASTE email LAST — the email keyboard auto-inserts domains mid-type,
#      paste is atomic. Clear button (first "Close") wipes leftovers.
#   3. Dismiss keyboard via the static "or" divider (hideKeyboard is
#      nondeterministic after the Paste menu), then coordinate-swipe the
#      form to its bottom — the Sign Up button sits below the fold and a
#      tap on an under-keyboard/off-screen element silently no-ops (the
#      60s hung-register symptom).

# ── Password (typed first, fresh pasteboard state) ──────────────────────────
- tapOn:
    id: "signUpPasswordInput"
- eraseText: 60
- inputText: "Abcdef123!"
- tapOn: "or"
- waitForAnimationToEnd:
    timeout: 1500

# ── Username (3-30 chars [a-zA-Z0-9_]) ─────────────────────────────────────
- tapOn:
    id: "signUpUsernameInput"
- eraseText: 60
- inputText: "__USER__"
- tapOn: "or"
- waitForAnimationToEnd:
    timeout: 1500

# ── Email: clear leftovers, paste ──────────────────────────────────────────
- tapOn:
    id: "signUpEmailInput"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd:
          timeout: 2000
- longPressOn:
    id: "signUpEmailInput"
- extendedWaitUntil:
    visible: "Paste"
    timeout: 6000
- tapOn: "Paste"
- waitForAnimationToEnd:
    timeout: 2000

# ── Dismiss keyboard, scroll to bottom, submit ─────────────────────────────
- tapOn: "or"
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%,78%"
    end: "50%,38%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "signUpSubmitButton"

# ── Validation-alert retries ───────────────────────────────────────────────
# If a typed field came out partial, submit raises a validation alert —
# retype, close the keyboard, scroll, resubmit. Validation order:
# email (pasted, exact) → password → username.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Invalid Email"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpEmailInput"
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
            - waitForAnimationToEnd:
                timeout: 1500
      - longPressOn:
          id: "signUpEmailInput"
      - extendedWaitUntil:
          visible: "Paste"
          timeout: 6000
      - tapOn: "Paste"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: "or"
      - waitForAnimationToEnd:
          timeout: 1500
      - swipe:
          start: "50%,78%"
          end: "50%,38%"
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpSubmitButton"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Password Requirements"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpPasswordInput"
      - eraseText: 60
      - inputText: "Abcdef123!"
      - tapOn: "or"
      - waitForAnimationToEnd:
          timeout: 1500
      - swipe:
          start: "50%,78%"
          end: "50%,38%"
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpSubmitButton"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Invalid Username"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpUsernameInput"
      - eraseText: 60
      - inputText: "__USER__"
      - tapOn: "or"
      - waitForAnimationToEnd:
          timeout: 1500
      - swipe:
          start: "50%,78%"
          end: "50%,38%"
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "signUpSubmitButton"
      - waitForAnimationToEnd:
          timeout: 3000

# ── Success gate ───────────────────────────────────────────────────────────
# register() must navigate to the style quiz — a silently no-op submit
# (button out of reach) or hung register would otherwise pass the fill.
- extendedWaitUntil:
    visible: "Your Style, Decoded."
    timeout: 60000

# iOS may offer to save the credentials; the quiz is the real success signal.
- runFlow:
    when:
      visible: ".*Save Password.*"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 3000
