appId: host.exp.Exponent
name: full_legal_privacy
tags:
  - full
  - expo-go
  - legal
---
# Privacy Policy via deep link (opened from the shell BEFORE this flow:
# exp://<host>:8081/--/privacy). Validates the linking map entry +
# guarded back chevron. Ends on tabs. Logged IN.
- extendedWaitUntil:
    visible: ".*(Политика конфиденциальности|Privacy Policy).*"
    timeout: 30000
- tapOn: ".*(Назад|Back|Go back).*"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: ".*(Сегодняшний образ|Today|Мой гардероб|My Wardrobe|Вдохновение|Inspo|Inspiration|Аккаунт|Account|Home|Closet|Profile).*"
- takeScreenshot: full_legal_privacy
