appId: org.name.AIWardrobe
name: forgot_password_flow
tags:
  - auth
---
# Forgot Password: navigate from Sign In, fill email, submit.
- launchApp:
    stopApp: false
- repeat:
    while:
      notVisible: "Sign In"
    times: 20
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
# Dismiss any leftover alerts from previous tests
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# Dismiss keyboard and clear any leftover state
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
# Navigate to Forgot Password by text
- tapOn:
    text: "Forgot Password?"
- waitForAnimationToEnd:
    timeout: 5000
# Type email
- tapOn:
    text: "Email"
- inputText: "qa+reset@aiwardrobe.club"
- takeScreenshot: .maestro/screenshots/forgot_02_filled.png
# Submit with Send reset link button
- tapOn:
    text: "Send reset link"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: .maestro/screenshots/forgot_03_after_submit.png
# Verify results
- assertVisible:
    text: "Check Your Email"
    optional: true
- assertVisible:
    text: "Back to Sign In"
    optional: true
