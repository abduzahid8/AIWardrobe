appId: org.name.AIWardrobe
---
# Forgot Password flow using coordinate-based taps
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# Navigate to Forgot Password
- tapOn:
    point: "50%,39%"
- waitForAnimationToEnd:
    timeout: 5000

# Type email (field has autoFocus, should be focused)
- inputText: "qa+reset@aiwardrobe.club"
- takeScreenshot: .maestro/screenshots/forgot_02_filled.png

# Dismiss keyboard so content returns to centered position
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

# Tap Send Reset Link button (~57% with centered layout)
- tapOn:
    point: "50%,57%"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: .maestro/screenshots/forgot_03_after_submit.png
