appId: com.aiwardrobe
name: sim_stylist_verify
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Your Outfits"
    commands:
      - tapOn:
          id: aiResultsBack
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: ".*(Good morning|Good afternoon|Good evening|Create outfit).*"
    commands:
      - tapOn:
          point: "58%,92%"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Магазин|Shop).*"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Персональный стилист|Personal stylist).*"
      - waitForAnimationToEnd:
          timeout: 10000
- assertVisible: ".*Generate outfit.*"
- tapOn: ".*(New clothing|Новая одежда).*"
- waitForAnimationToEnd:
    timeout: 2500

# ── 1. Casual + Minimalist ──
- tapOn:
    id: stylistOccasion-casual
- waitForAnimationToEnd:
    timeout: 800
- scrollUntilVisible:
    element:
      id: stylistStyle-minimalist
    direction: DOWN
    timeout: 8000
- tapOn:
    id: stylistStyle-minimalist
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: stylistGenerate
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: verify_casual_minimalist_c1
- scrollUntilVisible:
    optional: true
    element:
      id: stylistResult-1
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 40
- takeScreenshot: verify_casual_minimalist_c2
- tapOn:
    id: aiResultsBack
- waitForAnimationToEnd:
    timeout: 8000

# ── 2. Formal + Old Money ──
- scrollUntilVisible:
    element:
      id: stylistOccasion-formal
    direction: DOWN
    timeout: 8000
- tapOn:
    id: stylistOccasion-formal
- waitForAnimationToEnd:
    timeout: 800
- scrollUntilVisible:
    element:
      id: stylistStyle-old_money
    direction: DOWN
    timeout: 8000
- tapOn:
    id: stylistStyle-old_money
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: stylistGenerate
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: verify_formal_old_money_c1
- scrollUntilVisible:
    optional: true
    element:
      id: stylistResult-1
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 40
- takeScreenshot: verify_formal_old_money_c2
- tapOn:
    id: aiResultsBack
- waitForAnimationToEnd:
    timeout: 8000

# ── 3. Travel + Semi-Classic ──
- scrollUntilVisible:
    element:
      id: stylistOccasion-travel
    direction: DOWN
    timeout: 8000
- tapOn:
    id: stylistOccasion-travel
- waitForAnimationToEnd:
    timeout: 800
- scrollUntilVisible:
    element:
      id: stylistStyle-semi_classic
    direction: DOWN
    timeout: 8000
- tapOn:
    id: stylistStyle-semi_classic
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: stylistGenerate
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: verify_travel_semi_c1
- scrollUntilVisible:
    optional: true
    element:
      id: stylistResult-1
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 40
- takeScreenshot: verify_travel_semi_c2
