appId: org.name.AIWardrobe
name: auth_signin_wrong_credentials
tags:
  - auth
---
# Verify wrong-password error path on Sign In.
- launchApp:
    stopApp: false
- repeat:
    while:
      notVisible: "Sign In"
    times: 20
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "50%,45%"
- inputText: "qa+nonexistent@aiwardrobe.club"
- tapOn:
    point: "50%,52%"
- inputText: "WrongPass1234"
- tapOn:
    point: "50%,62%"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: .maestro/screenshots/signin_wrong_02_error.png
- tapOn:
    text: "OK"
- waitForAnimationToEnd:
    timeout: 3000
