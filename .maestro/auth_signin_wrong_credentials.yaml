appId: org.name.AIWardrobe
---
# Verify wrong-password error path on Sign In.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 60000
- tapOn:
    point: "50%,26%"
- inputText: "qa+nonexistent@aiwardrobe.club"
- tapOn:
    point: "50%,33%"
- inputText: "WrongPass1234"
- tapOn:
    point: "50%,44%"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: .maestro/screenshots/signin_wrong_02_error.png
# Tap OK on error alert (centered at ~55% for single-button iOS alert)
- tapOn:
    point: "50%,55%"
- waitForAnimationToEnd:
    timeout: 3000
