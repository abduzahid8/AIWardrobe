appId: com.aiwardrobe
name: sim_stylist_chips
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "Your Outfits"
    commands:
      - tapOn:
          point: "8%,11%"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: ".*(Good morning|Good afternoon|Good evening|Create outfit).*"
    commands:
      - tapOn:
          point: "58%,92%"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Магазин|Shop).*"
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: ".*(Персональный стилист|Personal stylist).*"
      - waitForAnimationToEnd:
          timeout: 10000
- tapOn: ".*(New clothing).*"
- waitForAnimationToEnd:
    timeout: 2500

# Casual occasion + Casual style
- tapOn: ".*Casual.*"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*More \\(4\\).*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: ".*Casual.*"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*Generate outfit.*"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: chip_casual
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000

# Date night + Classic
- tapOn: ".*More \\(4\\).*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: ".*Date night.*"
