    point: "58%,92%"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: ".*Inspiration.*"
- tapOn:
    point: "74%,92%"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: ".*Account.*"
- tapOn:
    point: "26%,92%"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible:
    text: "Good (morning|afternoon|evening|night).*"
- takeScreenshot: tabs_b_home
