appId: com.aiwardrobe
name: sim_stylist_more
---
# Continue from Your Outfits of scenario 1.
- launchApp:
    stopApp: false
- swipe:
    start: "80%,45%"
    end: "18%,45%"
- waitForAnimationToEnd:
    timeout: 3500
- takeScreenshot: s1_card2
- swipe:
    start: "80%,45%"
    end: "18%,45%"
- waitForAnimationToEnd:
    timeout: 3500
- takeScreenshot: s1_card3
- tapOn:
    point: "8%,11%"
- waitForAnimationToEnd:
    timeout: 8000

# 2 date night classic
- tapOn:
    point: "50%,72%"
- eraseText
- inputText: "date night classic"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*Generate outfit.*"
- extendedWaitUntil:
    visible: "Your Outfits"
    timeout: 55000
- takeScreenshot: s2_date_classic
- swipe:
    start: "80%,45%"
    end: "18%,45%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s2_card2
