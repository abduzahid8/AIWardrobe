appId: com.aiwardrobe
---
# Sign In -> Forgot Password -> back using coordinate-based taps
- launchApp
- waitForAnimationToEnd:
    timeout: 30000

# Navigate to Forgot Password (link is ~14pt below sign-in button at 44%)
- tapOn:
    point: "50%,39%"
- waitForAnimationToEnd:
    timeout: 5000

# Go back to Sign In via back arrow (absolute: top ~60, left ~24)
- tapOn:
    point: "11%,9%"
- waitForAnimationToEnd:
    timeout: 3000
