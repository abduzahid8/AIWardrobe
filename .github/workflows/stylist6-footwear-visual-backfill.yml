name: Stylist 6 bounded catalog photo intelligence
run-name: 'Stylist 6 | source-verified product photos, four bounded workers'
on:
  push:
    branches: [codex/stylist6-visual-first-20261110]
    paths:
      - .github/workflows/stylist6-footwear-visual-backfill.yml
      - scripts/visual/enrich_catalog.py
      - scripts/visual/test_fetch_image_transport.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stylist6-bounded-catalog-visual
  cancel-in-progress: false
jobs:
  enrich-source-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [1, 2, 3, 4]
    env:
      STYLIST_VISUAL_WORKER_URL: ${{ secrets.STYLIST_VISUAL_WORKER_URL }}
      STYLIST_VISUAL_WORKER_TOKEN: ${{ secrets.STYLIST_VISUAL_WORKER_TOKEN }}
      STYLIST_VISUAL_SKIP_SEED: '1'
      STYLIST_VISUAL_MAX_IMAGES: '128'
      STYLIST_VISUAL_RUN_SECONDS: '2400'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check true-source image download transport before model installation
        run: python3 -m unittest discover -s scripts/visual -p 'test_fetch_image_transport.py' -v
      - name: Confirm narrowly scoped visual-worker credentials
        run: |
          test -n "$STYLIST_VISUAL_WORKER_URL"
          test -n "$STYLIST_VISUAL_WORKER_TOKEN"
      - name: Fail closed if the worker would seed the entire catalog
        run: |
          test "$STYLIST_VISUAL_SKIP_SEED" = '1'
          test "$STYLIST_VISUAL_MAX_IMAGES" = '128'
          test "$STYLIST_VISUAL_RUN_SECONDS" = '2400'
          grep -q "STYLIST_VISUAL_SKIP_SEED" scripts/visual/cloud/worker.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: siglip2-75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2-cpu-v1
      - name: Install pinned local CPU visual model
        run: |
          pip install --quiet torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r scripts/visual/cloud/requirements.txt
      # The exact-source Supabase queue determines product scope: the same
      # vetted 4×128 runner handles top, outerwear, bottom OR shoes without
      # silently enqueuing or rewriting any merchant catalog item.
      - name: Process only 128 explicitly queued exact-source images per worker
        run: python scripts/visual/cloud/worker.py
