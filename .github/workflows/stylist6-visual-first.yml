name: Stylist 6 visual-first isolated prototype
on:
  push:
    branches:
      - codex/stylist6-visual-first-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-visual-first-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Syntax-check independent creative planner
        run: node --check backend/stylist6/prototype.mjs
      - name: Test real-SKU grounding and fail-closed contracts (mock providers, NO API calls)
        run: node --test backend/stylist6/prototype.test.mjs
      - name: Verify benchmark scenarios contain 35 unique requests
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const f=JSON.parse(fs.readFileSync("benchmarks/stylist6/scenarios.json","utf8"));
            assert.equal(f.scenarios.length,35);
            assert.equal(new Set(f.scenarios.map(x=>x.id)).size,35);
            assert.equal(f.testsNotRun,true);
            console.log("35 A/B scenarios defined; no live API tests executed");
          '
      - name: Verify owner-authorized Instagram dataset importer (synthetic archive only)
        run: python3 -m unittest scripts/style_references/test_import_instagram_archive.py -v
      - name: Verify curated references are fail-closed (no photo uploads)
        run: node --test backend/stylist6/reference_library.test.mjs
      - name: Verify 46 curated outfit briefs and reference-first integration (offline mocks)
        run: node --test backend/stylist6/lookbook_briefs.test.mjs
      - name: Verify snapshot catalog adapter and knit base-layer projection
        run: node --test backend/stylist6/catalog_adapter.test.mjs
      - name: Verify hosted visual critic contract (recorded fixtures, NO API calls)
        run: |
          node --test backend/stylist6/visual_critic_hosted.test.mjs backend/stylist6/nvidia_integration.test.mjs backend/stylist6/retail_evidence.test.mjs scripts/stylist6/stylist6_nvidia_pilot.test.mjs
          node --experimental-strip-types --test backend/stylist-node/test/stylist6-vision-test.test.mjs
      - name: Syntax-check pilot harness and contact sheets
        run: |
          node --check scripts/stylist6/pilot_12.mjs
          node --check scripts/stylist6/retail_replay.mjs
          node --check scripts/stylist6/retail_audit.mjs
          node --check scripts/stylist6/reliability_report.mjs
          python3 -m py_compile scripts/stylist6/blind_review.py
          python3 -m unittest scripts/stylist6/test_blind_review.py -v
          node --check scripts/stylist6/catalog_drift.mjs
          node --check scripts/stylist6/image_access.mjs
          node --check backend/stylist6/catalog_adapter.mjs
          node --check backend/stylist6/visual_critic_hosted.mjs
          python3 -m py_compile scripts/stylist6/contact_sheets_12.py
      - name: Verify catalog drift reporter (synthetic fixtures, NO live access)
        run: node --test scripts/stylist6/catalog_drift.test.mjs
      - name: Verify authorized image-access policy (blocked hosts, NO network)
        run: node --test scripts/stylist6/image_access.test.mjs
      - name: Smoke-run one pilot scenario offline (S6 arms, NO image downloads)
        run: |
          node scripts/stylist6/pilot_12.mjs --out "$RUNNER_TEMP/s6-smoke" --scenarios S6-01
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const r = JSON.parse(fs.readFileSync("benchmarks/stylist6/pilot_12_report.json", "utf8"));
            assert.equal(r.scenarios.length, 1);
            for (const arm of ["creative-first", "reference-first"]) {
              assert.equal(r.scenarios[0].arms[arm].looks, 3);
              assert.equal(r.scenarios[0].arms[arm].visualVerdict, "NOT_RUN");
            }
            console.log("pilot smoke: S6 arms produced 3 retrieval decks each, zero API calls");
          '
      - name: Verify flat-lay ZIP import never stores unsafe/unreviewed media
        run: python3 -m unittest scripts/style_references/test_import_flatlay_archive.py -v
      - name: Verify private Supabase reference upload gate (synthetic images, NO API calls)
        run: python3 -m unittest scripts/style_references/test_upload_private_reference_bundle.py -v
      - name: Verify canonical image-teaste folder without ZIP (offline synthetic test)
        run: python3 -m unittest scripts/style_references/test_verify_image_teaste_folder.py -v
      - name: Confirm this workflow is not an authorized production release
        run: |
          echo "Stylist 6 is isolated; no deploys, quota calls, migrations or production cutover."
